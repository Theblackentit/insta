<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline Insta Clone</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top-bar">
      <h1>Offline Insta Clone</h1>
      <p>Everything stays on this device (saved in localStorage).</p>
    </header>

    <main class="layout">
      <section class="panel" aria-labelledby="accounts-title">
        <h2 id="accounts-title">Accounts</h2>
        <form id="account-form" class="stack">
          <label for="username">Create account</label>
          <div class="inline">
            <input id="username" name="username" type="text" maxlength="24" placeholder="username" required />
            <button type="submit">Add</button>
          </div>
        </form>
        <ul id="account-list" class="account-list"></ul>
      </section>

      <section class="panel" aria-labelledby="post-title">
        <h2 id="post-title">Create post</h2>
        <p id="active-account" class="muted">No account selected</p>
        <form id="post-form" class="stack">
          <label for="photo">Photo</label>
          <input id="photo" name="photo" type="file" accept="image/*" required />

          <label for="caption">Caption</label>
          <textarea id="caption" name="caption" rows="3" maxlength="220" placeholder="Write a caption..."></textarea>

          <button type="submit">Post</button>
        </form>
      </section>

      <section class="panel feed-panel" aria-labelledby="feed-title">
        <div class="feed-header">
          <h2 id="feed-title">Feed</h2>
          <button id="clear-data" class="ghost" type="button">Reset app data</button>
        </div>
        <div id="feed" class="feed"></div>
      </section>
    </main>

    <template id="post-template">
      <article class="post">
        <header class="post-head">
          <span class="post-user"></span>
          <time class="post-time"></time>
        </header>
        <img class="post-image" alt="Posted photo" />
        <p class="post-caption"></p>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
