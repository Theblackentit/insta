<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Offline Insta Clone</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="top-bar">
      <div>
        <h1>Offline Insta Clone</h1>
        <p>Local-only photo app. No internet, no backend, all data is on-device.</p>
      </div>
      <div class="top-actions">
        <button id="view-feed" type="button" class="ghost active">Feed</button>
        <button id="view-profile" type="button" class="ghost">Profile</button>
        <button id="view-reels" type="button" class="ghost">Reels</button>
      </div>
    </header>

    <main class="layout">
      <aside class="panel" aria-labelledby="accounts-title">
        <h2 id="accounts-title">Accounts</h2>
        <form id="account-form" class="stack">
          <label for="username">Create account</label>
          <div class="inline">
            <input id="username" name="username" type="text" maxlength="24" placeholder="username" required />
            <button type="submit">Add</button>
          </div>
        </form>
        <p class="muted small">Click an account to switch and view that account profile.</p>
        <ul id="account-list" class="account-list"></ul>
      </aside>

      <section class="panel" aria-labelledby="post-title">
        <h2 id="post-title">Create post</h2>
        <p id="active-account" class="muted">No account selected</p>
        <form id="post-form" class="stack">
          <label for="photo">Photo</label>
          <input id="photo" name="photo" type="file" accept="image/*" required />

          <label for="caption">Caption</label>
          <textarea id="caption" name="caption" rows="3" maxlength="220" placeholder="Write a caption..."></textarea>

          <button type="submit">Post</button>
        </form>
      </section>

      <section class="panel feed-panel" aria-labelledby="content-title">
        <div class="feed-header">
          <div>
            <h2 id="content-title">Posts</h2>
            <p id="view-title" class="muted small">All accounts</p>
          </div>
          <button id="clear-data" class="ghost" type="button">Reset app data</button>
        </div>

        <div id="feed" class="feed"></div>
        <div id="reels" class="reels hidden"></div>
      </section>
    </main>

    <template id="post-template">
      <article class="post" tabindex="0">
        <header class="post-head">
          <span class="post-user"></span>
          <time class="post-time"></time>
        </header>
        <img class="post-image" alt="Posted photo" />
        <p class="post-caption"></p>
        <footer class="post-footer muted small">
          <span class="post-comments-count"></span>
          <span>Click to open</span>
        </footer>
      </article>
    </template>

    <dialog id="post-modal" class="post-modal">
      <article class="modal-content">
        <button id="close-modal" class="close" type="button" aria-label="Close">×</button>
        <img id="modal-image" class="modal-image" alt="Selected post" />
        <div class="modal-meta">
          <h3 id="modal-user"></h3>
          <p id="modal-caption"></p>
          <p id="modal-time" class="muted small"></p>

          <h4>Comments</h4>
          <ul id="modal-comments" class="comment-list"></ul>

          <form id="comment-form" class="stack">
            <input id="comment-input" name="comment" type="text" maxlength="180" placeholder="Write a comment..." required />
            <button type="submit">Add comment</button>
          </form>
        </div>
      </article>
    </dialog>

    <script src="app.js"></script>
  </body>
</html>
